run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell

linters-settings:
  errcheck:
    exclude-functions:
      - (*github.com/go-rod/rod.Page).Close
      - (*github.com/go-rod/rod.Browser).Close
      - (*os.File).Close
      - fmt.Fprintf
      - fmt.Fprint
      - fmt.Fprintln
  gosec:
    excludes:
      - G104 # already covered by errcheck
      - G204 # subprocess with variable args — expected in CLI tools
      - G304 # file path from variable — expected in CLI tools
      - G306 # WriteFile perms — we intentionally use 0o644 for non-secret files
      - G401 # sha1 used for non-crypto hashing (session state key derivation)
      - G404 # math/rand used for human-simulation jitter, not security
      - G505 # sha1 import — see G401
  misspell:
    ignore-words:
      - vehicule
      - immobilier
  gocritic:
    disabled-checks:
      - exitAfterDefer
      - unlambda
      - ifElseChain
      - singleCaseSwitch

issues:
  exclude-dirs:
    - benchmark
  exclude-rules:
    - linters: [staticcheck]
      text: "SA1019.*Dial has been deprecated"
    - linters: [gosimple]
      path: packages/
  max-issues-per-linter: 0
  max-same-issues: 0
