<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghostchrome dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0f0f;color:#e0e0e0;display:flex;height:100vh}
#viewport{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
#viewport img{max-width:100%;max-height:100%;object-fit:contain}
#sidebar{width:320px;background:#1a1a1a;border-left:1px solid #333;display:flex;flex-direction:column}
#header{padding:12px 16px;border-bottom:1px solid #333;font-size:14px;font-weight:600;color:#8b5cf6}
#events{flex:1;overflow-y:auto;padding:8px 12px;font-size:12px;font-family:'SF Mono',monospace}
.event{padding:4px 0;border-bottom:1px solid #222;white-space:pre-wrap;word-break:break-all}
.event time{color:#666;margin-right:8px}
#status{padding:8px 16px;border-top:1px solid #333;font-size:11px;color:#666}
.connected{color:#22c55e!important}
.disconnected{color:#ef4444!important}
</style>
</head>
<body>
<div id="viewport"><img id="frame" alt="viewport"></div>
<div id="sidebar">
  <div id="header">ghostchrome live</div>
  <div id="events"></div>
  <div id="status" class="disconnected">disconnected</div>
</div>
<script>
const frame=document.getElementById('frame');
const events=document.getElementById('events');
const status=document.getElementById('status');
let ws;
function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onopen=()=>{status.textContent='connected';status.className='connected'};
  ws.onclose=()=>{status.textContent='disconnected';status.className='disconnected';setTimeout(connect,1000)};
  ws.onerror=()=>ws.close();
  ws.onmessage=(e)=>{
    const msg=JSON.parse(e.data);
    if(msg.type==='frame'){
      frame.src='data:image/jpeg;base64,'+msg.data;
    }else if(msg.type==='event'){
      const div=document.createElement('div');
      div.className='event';
      const t=document.createElement('time');
      t.textContent=new Date().toLocaleTimeString();
      div.appendChild(t);
      div.appendChild(document.createTextNode(msg.event));
      events.prepend(div);
      if(events.children.length>200)events.lastChild.remove();
    }
  };
}
connect();
</script>
</body>
</html>
