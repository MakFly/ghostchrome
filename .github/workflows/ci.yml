name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -short -count=1 -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: golangci/golangci-lint-action@v9
        with:
          # v2, and the prebuilt binary again. The old v1.64.8 pin existed
          # because .golangci.yml was v1-format; it also had to be built from
          # source, since v1's prebuilt binaries were built with a Go older
          # than go.mod's target and refused to run. The v2 releases track a
          # current Go, so `install-mode: goinstall` and its ~2 min of build
          # are no longer the price of linting.
          #
          # Same version as the local toolchain on purpose: a linter that only
          # exists in CI is a linter nobody runs before pushing.
          version: v2.12.2

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: go test -count=1 -race ./...
